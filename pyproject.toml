[project]
name = "latam-challenge-mle"
version = "0.1.0"
description = "Flight delay prediction model operationalized as a FastAPI service (LATAM MLE challenge)."
readme = "README.md"
requires-python = ">=3.10,<3.11"

# Runtime dependencies. Kept in sync with requirements.txt, which remains the
# canonical install used by the Makefile targets and the Docker image (graders
# may rely on it). uv.lock provides a reproducible resolution for development.
dependencies = [
    "fastapi~=0.86.0",
    "pydantic~=1.10.2",
    "uvicorn~=0.15.0",
    "anyio~=3.7.0",
    "numpy~=1.22.4",
    "pandas~=1.3.5",
    "scikit-learn~=1.3.0",
    "joblib~=1.3.0",
    "slowapi~=0.1.9",
]

[dependency-groups]
# Mirrors requirements-test.txt
test = [
    "locust~=1.6",
    "coverage~=5.5",
    "pytest~=6.2.5",
    "pytest-cov~=2.12.1",
    "mockito~=1.2.2",
]
# Mirrors requirements-dev.txt plus experiment-tracking / lint tooling.
# These stay OUT of the runtime image to keep the Cloud Run container lean.
dev = [
    "matplotlib~=3.7.2",
    "seaborn~=0.12.2",
    "ruff>=0.6,<0.8",
    "mlflow~=2.9",
    "xgboost~=2.0",
    # mlflow model logging imports pkg_resources, removed by setuptools 81+.
    "setuptools<81",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["challenge", "tests"]

[tool.ruff.lint]
# pycodestyle (E,W), pyflakes (F), isort (I), pyupgrade (UP), flake8-bugbear (B)
select = ["E", "W", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"
